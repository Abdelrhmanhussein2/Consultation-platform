services:

  postgres:
    image: postgres:16
    container_name: consultation_db
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d consultation_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - consultation_network

  neo4j:
    image: neo4j:5-community
    container_name: consultation_graph
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/supersecretpassword2026
    volumes:
      - neo4j_data:/data
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    networks:
      - consultation_network

  redis:
    image: redis:7-alpine
    container_name: consultation_redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save 900 1 --save 300 10 --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - consultation_network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: consultation_vector
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - consultation_network

  backend:
    build:
      context: ../
      dockerfile: DockerFile
    container_name: consultation_backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:consultation123@postgres:5432/consultation_db
      NEO4J_URI: bolt://consultation_graph:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: supersecretpassword2026
      REDIS_URL: redis://consultation_redis:6379/0
      QDRANT_HOST: consultation_vector
      QDRANT_PORT: 6333
    command: sh -c "alembic upgrade head && exec uvicorn main:app --host 0.0.0.0 --port 5000"
    ports:
      - "5000:5000"
    volumes:
      - ../:/app
    networks:
      - consultation_network
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started
      redis:
        condition: service_started
      qdrant:
        condition: service_started

networks:
  consultation_network:
    driver: bridge

volumes:
  postgres_data:
  neo4j_data:
  neo4j_import:
  neo4j_plugins:
  redis_data:
  qdrant_data:
