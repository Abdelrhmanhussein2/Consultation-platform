services:

  postgres:
    image: postgres:15
    container_name: consultation_db
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - consultation_network

  neo4j:
    image: neo4j:5-community
    container_name: consultation_graph
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/supersecretpassword2026
    volumes:
      - neo4j_data:/data
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    networks:
      - consultation_network

  backend:
    build:
      context: ../
      dockerfile: DockerFile
    container_name: consultation_backend
    environment:
      DATABASE_URL: postgresql://postgres:consultation123@postgres:5432/consultation_db
      SECRET_KEY: IfYouChangeItYouAreGuy
      ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
      NEO4J_URI: bolt://consultation_graph:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: supersecretpassword2026
    ports:
      - "5000:5000"
    volumes:
      - ../:/app
    networks:
      - consultation_network
    depends_on:
      - postgres
      - neo4j

networks:
  consultation_network:
    driver: bridge

volumes:
  postgres_data:
  neo4j_data:
  neo4j_import:
  neo4j_plugins: